name: Nix Diff

on:
  pull_request:

jobs:
  nix-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: sewoshun
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Generate nix diff
        uses: natsukium/nix-diff-action@main
        with:
          build: "true"
          attributes: |
            - displayName: desktop
              attribute: nixosConfigurations.desktop.config.system.build.toplevel
            - displayName: thinkpad-e14-gen7
              attribute: nixosConfigurations.thinkpad-e14-gen7.config.system.build.toplevel
