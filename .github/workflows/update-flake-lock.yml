name: Update flake.lock

on:
  schedule:
    - cron: '0 15 * * *' # Daily at 15:00 UTC = 00:00 JST
  workflow_dispatch:

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get datetime (JST)
        id: datetime
        run: echo "jst=$(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update flake.lock
        run: nix flake update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet flake.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore: update flake.lock"
          branch: update/flake-lock
          base: main
          delete-branch: true
          title: "chore: update flake.lock (${{ steps.datetime.outputs.jst }})"
          body: |
            Auto-generated by GitHub Actions.

            See the nix-diff comment below for package and closure size changes.

      - name: Notify Discord on failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "NixOS flake.lock update failed"
          description: "${{ steps.datetime.outputs.jst }} - Update failed. Please check the logs."
          color: 0xFF0000
